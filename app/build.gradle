plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.redeclara.diagnostico'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'br.com.redeclara.diagnostico'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
